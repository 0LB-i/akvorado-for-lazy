services:
  # ClickHouse - Database para armazenamento de flows
  clickhouse:
    # CLICKHOUSE_VERSION é definido automaticamente pelo scripts/install.sh
    # (fixa uma versão antiga em CPUs sem AVX2, que travam builds recentes
    # com "Illegal instruction")
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-latest}
    container_name: akvorado-clickhouse
    restart: unless-stopped
    # Únicas portas abertas para a rede junto com o Console: permitem acesso
    # externo ao banco (Grafana, clientes SQL, dashboard/). Para fechar,
    # defina CLICKHOUSE_BIND=127.0.0.1 no .env.
    ports:
      - "${CLICKHOUSE_BIND:-0.0.0.0}:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_BIND:-0.0.0.0}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./config/clickhouse:/etc/clickhouse-server/config.d
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-akvorado}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-akvorado}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-akvorado123}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - akvorado-network
    healthcheck:
      # O healthcheck também garante que o banco "akvorado" existe.
      # O orchestrator NÃO cria o banco (só tabelas/dicionários dentro dele) e
      # a imagem do ClickHouse só cria o CLICKHOUSE_DB na primeira subida com
      # data/clickhouse vazio. Se essa primeira subida falhar no meio (ex.:
      # "Illegal instruction" em CPU sem AVX2 antes de fixar a versão), o
      # banco nunca é criado e o Console devolve 500 em tudo. Como o
      # orchestrator e o console esperam o ClickHouse ficar healthy, o banco
      # sempre existe antes deles subirem. IF NOT EXISTS torna isso um no-op
      # barato nas execuções seguintes. O nome "akvorado" é o mesmo fixado em
      # config/akvorado-orchestrator.yaml e na config do console abaixo.
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}"
          --query 'CREATE DATABASE IF NOT EXISTS akvorado'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Kafka - Message broker entre inlet e outlet
  # Roda em modo KRaft (sem Zookeeper), igual ao docker-compose oficial do
  # Akvorado v2.0.4 (mesma imagem e versão). Dados de uma instalação antiga
  # em modo Zookeeper (cp-kafka) são incompatíveis: scripts/install.sh e
  # `scripts/manage.sh update` movem data/kafka antigo para um backup.
  kafka:
    image: apache/kafka:4.1.1
    container_name: akvorado-kafka
    restart: unless-stopped
    # Só localhost: o Kafka não tem autenticação, qualquer um que alcançasse
    # essas portas poderia injetar ou ler flows. Os outros serviços usam a
    # rede interna do Docker (kafka:9092).
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
      # Usada pelo inlet, que roda com network_mode: host
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-9093}:9093"
    environment:
      # KRaft: um único nó fazendo papel de broker e controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      # Identificador do cluster (base64 de 16 bytes). Fixo de propósito: é
      # gravado no data/kafka na primeira subida e precisa bater depois.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-QWt2b3JhZG9Gb3JMYXp5MQ}
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Nó único: replicação 1 em todos os tópicos internos
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # A imagem roda como uid 1000 (appuser): install.sh faz o chown
      - ./data/kafka:/var/lib/kafka/data
    networks:
      - akvorado-network
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  # Akvorado Orchestrator - Gerenciamento e orquestração
  akvorado-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: akvorado-local:latest
    container_name: akvorado-orchestrator
    restart: unless-stopped
    command: ["orchestrator", "/etc/akvorado/config.yaml"]
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Só localhost: a API do orchestrator não tem autenticação e só é usada
    # pelos outros serviços (via rede interna) e pelos scripts locais.
    ports:
      - "127.0.0.1:${ORCHESTRATOR_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${ORCHESTRATOR_GRPC_PORT:-8081}:8081"
    volumes:
      - ./config/akvorado-orchestrator.yaml:/etc/akvorado/config.yaml:ro
      - ./data/geoip:/var/lib/geoip:ro
      - ./logs:/var/log/akvorado
    networks:
      - akvorado-network
    healthcheck:
      # Não use `nc -z` (só testa se a porta TCP abriu, não a saúde do processo)
      # nem `wget --spider` (faz HEAD, e as rotas do akvorado são registradas
      # apenas como GET no gin: HEAD cai em 404 e o wget sai com código 8,
      # deixando o container unhealthy para sempre mesmo estando saudável).
      # /api/v0/healthcheck existe em todos os serviços e retorna 503 quando
      # algum componente interno falha.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v0/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Akvorado Inlet - Coletor de flows (NetFlow/sFlow/IPFIX)
  akvorado-inlet:
    image: akvorado-local:latest
    container_name: akvorado-inlet
    restart: unless-stopped
    command: ["inlet", "/etc/akvorado/config.yaml"]
    depends_on:
      akvorado-orchestrator:
        condition: service_started
      kafka:
        condition: service_healthy
    network_mode: host
    volumes:
      - ./config/akvorado-inlet.yaml:/etc/akvorado/config.yaml:ro
      - ./logs:/var/log/akvorado
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/api/v0/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Akvorado Outlet - Consome do Kafka e escreve no ClickHouse
  akvorado-outlet:
    image: akvorado-local:latest
    container_name: akvorado-outlet
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["outlet", "http://akvorado-orchestrator:8080"]
    depends_on:
      akvorado-orchestrator:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - ./logs:/var/log/akvorado
      - akvorado-run:/run/akvorado
    environment:
      AKVORADO_CFG_OUTLET_METADATA_CACHEPERSISTFILE: /run/akvorado/metadata.cache
      AKVORADO_CFG_OUTLET_FLOW_STATEPERSISTFILE: /run/akvorado/flow.state
      # Core classifiers to accept all flows
      AKVORADO_CFG_OUTLET_CORE_EXPORTERCLASSIFIERS_0: 'ClassifyRegion("default")'
      AKVORADO_CFG_OUTLET_CORE_EXPORTERCLASSIFIERS_1: 'ClassifyTenant("default")'
      AKVORADO_CFG_OUTLET_CORE_EXPORTERCLASSIFIERS_2: 'ClassifyRole("edge")'
      AKVORADO_CFG_OUTLET_CORE_INTERFACECLASSIFIERS_0: 'ClassifyInternal()'
    networks:
      - akvorado-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v0/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Akvorado Console - Interface Web
  akvorado-console:
    image: akvorado-local:latest
    container_name: akvorado-console
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/config.yaml <<EOF
        http:
          listen: "0.0.0.0:8000"
        clickhouse:
          servers:
            - "clickhouse:9000"
          database: "akvorado"
          username: "${CLICKHOUSE_USER:-akvorado}"
          password: "${CLICKHOUSE_PASSWORD:-akvorado123}"
        database:
          driver: sqlite
          dsn: /var/lib/akvorado-console/console.sqlite
        EOF
        exec /usr/local/bin/akvorado console /tmp/config.yaml
    depends_on:
      # service_healthy: o healthcheck do ClickHouse garante o banco "akvorado"
      clickhouse:
        condition: service_healthy
    # Interface web: aberta para a rede. Para expor só via proxy reverso local,
    # defina CONSOLE_BIND=127.0.0.1 no .env.
    ports:
      - "${CONSOLE_BIND:-0.0.0.0}:${CONSOLE_HTTP_PORT:-8000}:8000"
    volumes:
      - ./logs:/var/log/akvorado
      - ./data/console:/var/lib/akvorado-console
    networks:
      - akvorado-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/api/v0/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  akvorado-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  akvorado-run:
